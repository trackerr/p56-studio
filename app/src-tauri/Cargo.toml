[package]
name = "p56-studio"
version = "0.3.32"
edition = "2021"
description = "Open-source Holoscope replacement for P56 POV hologram fans"
license = "MIT"

[lib]
name = "p56_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
p56-service = { path = "../../crates/p56-service" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde_json = "1"
log = "0.4"
env_logger = "0.11"
