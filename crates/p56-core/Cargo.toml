[package]
name = "p56-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Protocol, transcode and networking for Holoscope/P56 POV hologram fans"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "gif"] }
thiserror = "2"
jpeg-encoder = { version = "0.6", default-features = false }
log = "0.4"
serde = { version = "1", features = ["derive"] }
if-addrs = "0.15"
