[package]
name = "p56-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Simulator of a Holoscope / P56 POV hologram fan, for testing without hardware"

[lib]
name = "p56_sim"
path = "src/lib.rs"

[[bin]]
name = "p56-sim"
path = "src/main.rs"

[dependencies]
p56-core = { path = "../p56-core" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
