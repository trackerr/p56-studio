name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests (core, CLI, simulator, server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      # The Tauri app needs WebKitGTK on Linux; it is built in the release workflow.
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --exclude p56-studio --all-targets -- -D warnings
      - run: cargo test --workspace --exclude p56-studio
      - run: cargo build -p p56-server -p p56-sim
      - uses: actions/upload-artifact@v4
        with:
          name: p56-server-debug
          path: |
            target/debug/p56-server
            target/debug/p56-sim

  ui:
    name: Web UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm --dir app/ui install --frozen-lockfile
      - name: Type check (tsc -b)
        run: pnpm --dir app/ui exec tsc -b
      - run: pnpm --dir app/ui run bundle
      # The apps and p56-server embed this file, so a stale copy would ship an old UI.
      - name: Committed app/src/index.html is up to date
        run: git diff --stat --exit-code -- app/src/index.html

  home-assistant:
    name: Home Assistant integration
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: p56-server-debug
          path: bin
      - run: chmod +x bin/p56-server bin/p56-sim
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component
      - run: pytest
        working-directory: ha
        env:
          P56_SERVER: ${{ github.workspace }}/bin/p56-server
