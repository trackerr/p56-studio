name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.arch }} (server + CLI)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      # Static binaries, linked with rust-lld (see .cargo/config.toml): no C toolchain needed.
      - run: cargo build --release -p p56-server -p p56 --target ${{ matrix.arch }}-unknown-linux-musl
      - run: |
          mkdir out
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/p56-server out/p56-server-${{ matrix.arch }}-linux-musl
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/p56 out/p56-${{ matrix.arch }}-linux-musl
      - if: matrix.arch == 'x86_64'
        run: out/p56-server-x86_64-linux-musl --version
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: out/*

  windows:
    name: Windows (P56 Studio installer + CLI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm --dir app/ui install --frozen-lockfile
      - run: npm ci
        working-directory: app
      - run: npx tauri build
        working-directory: app
      - run: cargo build --release -p p56 -p p56-sim
      - shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item "target/release/bundle/nsis/*.exe" out/
          Copy-Item target/release/p56.exe out/p56-windows-x64.exe
          Copy-Item target/release/p56-sim.exe out/p56-sim-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  linux-app:
    name: Linux (P56 Studio .deb + AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm --dir app/ui install --frozen-lockfile
      - run: npm ci
        working-directory: app
      - run: npx tauri build --bundles deb,appimage
        working-directory: app
      - run: |
          mkdir out
          cp target/release/bundle/deb/*.deb out/
          cp target/release/bundle/appimage/*.AppImage out/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: out/*

  android:
    name: Android (P56 Studio APK)
    runs-on: ubuntu-latest
    env:
      # The signing key lives only in the repository secrets, never in git. Without it the APK is
      # still built (as a check) but not published.
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm --dir app/ui install --frozen-lockfile
      - run: npm ci
        working-directory: app
      - name: Signing key from the repository secrets
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > app/src-tauri/gen/android/keystore.properties
      - run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" npx tauri android build --apk --target aarch64 --target armv7 --target x86_64
        working-directory: app
      - run: |
          mkdir out
          v=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          apk=$(find app/src-tauri/gen/android/app/build/outputs/apk/universal/release -name '*.apk' | head -n1)
          cp "$apk" "out/P56-Studio-$v-android.apk"
          ls -l out
          rm -f "$RUNNER_TEMP/release.jks" app/src-tauri/gen/android/keystore.properties
      - if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  release:
    # A manual run only builds and checks everything; a version tag publishes.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, linux-app, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true
      # after every asset is in place, so the checksums cover all of them (the APK included)
      - run: |
          cd dl
          # GitHub turns spaces in asset names into dots; name the files that way first, so
          # SHA256SUMS matches the downloads
          for f in *\ *; do if [ -e "$f" ]; then mv "$f" "${f// /.}"; fi; done
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dl/*
          generate_release_notes: true
          fail_on_unmatched_files: true
