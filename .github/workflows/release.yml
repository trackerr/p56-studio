name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.arch }} (server + CLI)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      # Static binaries, linked with rust-lld (see .cargo/config.toml): no C toolchain needed.
      - run: cargo build --release -p p56-server -p p56 --target ${{ matrix.arch }}-unknown-linux-musl
      - run: |
          mkdir out
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/p56-server out/p56-server-${{ matrix.arch }}-linux-musl
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/p56 out/p56-${{ matrix.arch }}-linux-musl
      - if: matrix.arch == 'x86_64'
        run: out/p56-server-x86_64-linux-musl --version
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: out/*

  windows:
    name: Windows (P56 Studio installer + CLI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm --dir app/ui install --frozen-lockfile
      - run: npm ci
        working-directory: app
      - run: npx tauri build
        working-directory: app
      - run: cargo build --release -p p56 -p p56-sim
      - shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item "target/release/bundle/nsis/*.exe" out/
          Copy-Item target/release/p56.exe out/p56-windows-x64.exe
          Copy-Item target/release/p56-sim.exe out/p56-sim-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true
      - run: |
          cd dl
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dl/*
          generate_release_notes: true
          fail_on_unmatched_files: true
