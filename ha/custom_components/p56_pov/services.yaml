show_text:
  fields:
    device_id:
      selector:
        device:
          multiple: true
          integration: p56_pov
    text:
      required: true
      example: "0,23 €/kWh"
      selector:
        text:
          multiline: true
    color:
      example: "#ffcc00"
      selector:
        color_rgb:
    background:
      selector:
        color_rgb:
    font_size:
      advanced: true
      selector:
        number:
          min: 0
          max: 400
          unit_of_measurement: px
          mode: box
    show_seconds:
      example: 60
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
          mode: box
    mode:
      selector:
        select:
          options:
            - upload
            - cast
          translation_key: mode
    name:
      advanced: true
      example: energieprijs
      selector:
        text:

show_image:
  fields:
    device_id:
      selector:
        device:
          multiple: true
          integration: p56_pov
    path:
      example: /media/p56/logo.png
      selector:
        text:
    url:
      example: https://example.com/picture.png
      selector:
        text:
          type: url
    camera:
      selector:
        entity:
          domain: camera
    media:
      selector:
        media:
          accept:
            - image/*
    show_seconds:
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
          mode: box
    mode:
      selector:
        select:
          options:
            - upload
            - cast
          translation_key: mode
    name:
      advanced: true
      selector:
        text:
    scale:
      advanced: true
      selector:
        number:
          min: 0.1
          max: 5
          step: 0.05
    x_offset:
      advanced: true
      selector:
        number:
          min: -1
          max: 1
          step: 0.01
    y_offset:
      advanced: true
      selector:
        number:
          min: -1
          max: 1
          step: 0.01
    mirror:
      advanced: true
      selector:
        boolean:

play_file:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: p56_pov
    slot:
      selector:
        number:
          min: 1
          max: 255
          mode: box
    name:
      example: logo.mp4
      selector:
        text:

delete_file:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: p56_pov
    slot:
      selector:
        number:
          min: 1
          max: 255
          mode: box
    name:
      selector:
        text:
