configuration:
  fan_ip:
    name: Fan IP addresses
    description: >-
      Optional. Send the discovery packet straight to these fans as well
      (for fans on another subnet). Normally the fans are found by broadcast.
  advertise_ip:
    name: Advertised IP address
    description: >-
      Optional. The address the fans should connect back to. Empty = each
      network card announces its own address.
  lan_api:
    name: API reachable on the network
    description: >-
      Off (default): only Home Assistant itself (integration, rest_command,
      the panel) can use the HTTP API on port 8765. On: the whole network
      (apps or scripts on other machines); protect it with an API token.
  api_token:
    name: API token
    description: >-
      Optional. When set, clients on the network must send it, as the header
      "Authorization: Bearer <token>" or as "?token=<token>" in the URL.
      Home Assistant itself and the panel do not need it.
  simulate:
    name: Virtual fan
    description: Start a simulated P56 fan, to try everything without hardware.
  comfyui_url:
    name: ComfyUI address
    description: >-
      Optional. Make AI pictures with ComfyUI on a computer in your house,
      e.g. http://192.168.1.20:8188 (start ComfyUI with --listen; it needs the
      Qwen Image 2.1 model). Nothing leaves your network. When that computer
      is off, Home Assistant's AI Task (e.g. Google) is used instead.
  comfyui_size:
    name: ComfyUI picture size
    description: >-
      Optional. Width and height of ComfyUI's pictures in pixels (256-1536,
      default 768). A P56 shows about 344 pixels across, so more only costs
      time.
  log_level:
    name: Log level
    description: How much the add-on writes to its log.
